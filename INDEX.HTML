<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Gastro-Core VRM</title>
    <style>
        :root { --v-blue: #3065ab; --v-green: #5eb531; --v-gray: #e0e0e0; --bg: #f4f4f4; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .vrm-card { background: white; border-radius: 12px; padding: 20px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .gauge-container { position: relative; width: 200px; height: 110px; margin: 0 auto; overflow: hidden; }
        .arc { position: absolute; border-radius: 50%; border: 2px solid transparent; transform: rotate(-45deg); }
        .b-arc { width: 180px; height: 180px; border-color: var(--v-gray); top: 10px; left: 10px; border-bottom-color: transparent; border-right-color: transparent; }
        .s-arc { width: 150px; height: 150px; border-color: var(--v-blue); top: 25px; left: 25px; border-width: 6px; border-bottom-color: transparent; border-right-color: transparent; }
        .status-arc { width: 120px; height: 120px; border-color: var(--v-green); top: 40px; left: 40px; border-width: 10px; border-bottom-color: transparent; border-right-color: transparent; }
        .info { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="vrm-card">
        <h3>FINANCE MĚSÍC</h3>
        <div class="gauge-container">
            <div class="arc b-arc"></div>
            <div class="arc s-arc"></div>
            <div class="arc status-arc"></div>
        </div>
        <div class="info">Limit: 260 000 Kč</div>
        <p style="text-align:center; color: var(--v-blue)">Stav: OK</p>
    </div>
</body>
</html>
